
<div class="container">

  <h1>Book App</h1>
  <h2>This is sunil from banglore</h2>
  <span>All the best your youre feature</span>

  <input
    type="text"
    [(ngModel)]="bookName"
    placeholder="Enter Book Name"
  >

  <button (click)="addBook()">Add Book</button>

  <ul>
    <li *ngFor="let book of books; let i = index">
      {{ book }}

      <button class="delete-btn" (click)="deleteBook(i)">
        Delete
      </button>
    </li>
  </ul>

</div>
