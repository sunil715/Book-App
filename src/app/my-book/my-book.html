<div class="book-container">

  <div class="book-card">

    <h1>📚 Book Manager</h1>

    <p class="subtitle">
      Welcome! Manage your favorite books easily.
    </p>

    <div class="input-section">
      <input
        type="text"
        [(ngModel)]="bookName"
        placeholder="Enter Book Name"
      />

      <button (click)="addBook()">
        ➕ Add Book
      </button>
    </div>

    <div class="book-list">
      <h3>Your Books</h3>

      <ul>
        <li *ngFor="let book of books; let i = index">

          <span class="book-title">
            📖 {{ book }}
          </span>

          <button
            class="delete-btn"
            (click)="deleteBook(i)"
          >
            🗑 Delete
          </button>

        </li>
      </ul>

      <p *ngIf="books.length === 0" class="empty-msg">
        No books added yet.
      </p>

    </div>

  </div>

</div>
